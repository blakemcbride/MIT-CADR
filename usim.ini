# usim.ini --- configuration for the MIT CADR simulator (System 303.0)
#
# All paths are relative to the top of this repository; start the
# simulator with ./run (or "make run"), which does that for you.
# See usim/README.md for every available option.

[usim]
# Root of the host file system served to the Lisp Machine over the
# built-in Chaosnet FILE server.  The band expects to find /sys and
# /usite beneath it (see usite/sys.translations).
fs_root_directory = .
state_filename = usim.state
monitor = other
scale = 1.0

[ucode]
prommcr_filename = sys/ubin/promh.mcr
promsym_filename = sys/ubin/promh.sym
mcrsym_filename = sys/ubin/ucadr.sym
track_mouse = false

[chaos]
# "local" = embedded Chaosnet; no network access or daemon needed.
backend = local
hosts = usite/extra.hosts
myname = LOCAL-CADR
servername = LOCAL-BRIDGE

[disk]
disk0 = disks/disk-sys-303-0.img
